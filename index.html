<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 관리</title>
<style>
:root {
  --fg: #1f2328;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #2563eb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px 48px;
  font-family: -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  color: var(--fg);
  background: #fff;
  line-height: 1.5;
}
main { max-width: 600px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 16px; }

#warning {
  margin: 0 0 16px;
  padding: 10px 12px;
  border: 1px solid #fca5a5;
  background: #fef2f2;
  color: #991b1b;
  border-radius: 6px;
  font-size: 14px;
}

#progress { margin-bottom: 20px; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); transition: width .15s; }
.summary { margin-top: 6px; font-size: 15px; font-weight: 600; }
.per-category { font-size: 13px; color: var(--muted); }

#add-form { display: flex; gap: 8px; margin-bottom: 12px; }
#add-form #text { flex: 1 1 auto; min-width: 0; }
input, select, button {
  font: inherit;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: inherit;
}
button { cursor: pointer; }
button:hover:not(:disabled) { background: #f6f7f9; }
button:disabled { color: var(--muted); cursor: default; }
#add-form button[type="submit"] { background: var(--accent); border-color: var(--accent); color: #fff; }

#filters {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.status-tabs { display: inline-flex; gap: 4px; }
.status-tabs button.active { background: var(--fg); border-color: var(--fg); color: #fff; }
#clear-done { margin-left: auto; font-size: 14px; }

#list { list-style: none; margin: 0; padding: 0; }
#list li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
}
#list .text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
#list .edit-input { flex: 1 1 auto; min-width: 0; }
#list li.done .text { text-decoration: line-through; color: var(--muted); }
.badge {
  flex: 0 0 auto;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
#list button { padding: 4px 8px; font-size: 13px; }

#empty { color: var(--muted); padding: 24px 0; text-align: center; }

#test-panel {
  max-width: 600px;
  margin: 32px auto 0;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
  white-space: pre-wrap;
}
#test-panel div:last-child { margin-top: 8px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>할 일 관리</h1>

  <p id="warning" hidden></p>

  <section id="progress"></section>

  <form id="add-form" autocomplete="off">
    <input id="text" type="text" maxlength="200" placeholder="할 일 입력...">
    <!-- option 은 CATEGORIES 에서 생성한다 (라벨 중복을 피한다) -->
    <select id="category"></select>
    <button type="submit">추가</button>
  </form>

  <div id="filters">
    <span class="status-tabs">
      <button type="button" data-status="active">미완료</button>
      <button type="button" data-status="all">전체</button>
      <button type="button" data-status="done">완료</button>
    </span>
    <select id="filter-category"></select>
    <button type="button" id="clear-done">완료 비우기</button>
  </div>

  <ul id="list"></ul>
  <p id="empty" hidden></p>
</main>

<div id="test-panel"></div>

<template id="todo-item">
  <li>
    <input type="checkbox" class="check">
    <span class="text"></span>
    <span class="badge"></span>
    <button type="button" data-action="edit">수정</button>
    <button type="button" data-action="delete">삭제</button>
  </li>
</template>

<script>
/* =========================================================
   1. CONFIG
   ========================================================= */
const CATEGORIES = {
  work:     { label: "업무", color: "#2563eb" },
  personal: { label: "개인", color: "#16a34a" },
  study:    { label: "공부", color: "#9333ea" }
};
const STORAGE_KEY = "todolist.v1";
const CORRUPT_KEY = "todolist.v1.corrupt";
const MAX_LEN = 200;

/* =========================================================
   2. STORAGE  — localStorage만 아는 층
   ========================================================= */
function loadState(store = localStorage) {
  const empty = { version: 1, todos: [] };
  let raw;
  try {
    raw = store.getItem(STORAGE_KEY);
  } catch (err) {
    return { state: empty, error: "unavailable" };
  }
  if (raw === null) return { state: empty, error: null };

  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (err) { parsed = null; }

  if (!parsed || !Array.isArray(parsed.todos)) {
    // 손상된 원본은 덮어쓰지 않고 따로 보존한다
    try { store.setItem(CORRUPT_KEY, raw); } catch (err) { /* 보존 실패는 무시 */ }
    return { state: empty, error: "corrupt" };
  }
  return { state: { version: 1, todos: parsed.todos }, error: null };
}

// 테스트에서 바꿔 끼울 수 있도록 function 선언 대신 let 으로 둔다
let saveState = function (state, store = localStorage) {
  try {
    store.setItem(STORAGE_KEY, JSON.stringify(state));
    return { ok: true, error: null };
  } catch (err) {
    return { ok: false, error: err && err.message ? err.message : String(err) };
  }
};

/* =========================================================
   3. LOGIC  — DOM을 모르는 순수 함수
   거부되는 입력은 원본 todos 를 그대로(같은 참조로) 돌려준다
   ========================================================= */
function normalizeText(text) {
  return String(text == null ? "" : text).replace(/\s+/g, " ").trim();
}

function makeId(now = Date.now()) {
  return now.toString(36) + "_" + Math.random().toString(36).slice(2, 7);
}

function addTodo(todos, text, category, now = Date.now(), idFn = makeId) {
  const clean = normalizeText(text);
  if (clean === "" || clean.length > MAX_LEN) return todos;
  let id = idFn(now);
  for (let i = 0; i < 5 && todos.some(t => t.id === id); i++) id = idFn(now);
  return todos.concat({ id, text: clean, category, done: false, createdAt: now, completedAt: null });
}

function toggleTodo(todos, id, now = Date.now()) {
  if (!todos.some(t => t.id === id)) return todos;
  return todos.map(t => (t.id === id ? { ...t, done: !t.done, completedAt: t.done ? null : now } : t));
}

function editTodo(todos, id, text) {
  const clean = normalizeText(text);
  if (clean === "" || clean.length > MAX_LEN) return todos;
  if (!todos.some(t => t.id === id)) return todos;
  return todos.map(t => (t.id === id ? { ...t, text: clean } : t));
}

function removeTodo(todos, id) {
  if (!todos.some(t => t.id === id)) return todos;
  return todos.filter(t => t.id !== id);
}

function clearCompleted(todos, category = "all") {
  const isTarget = t => t.done && (category === "all" || t.category === category);
  if (!todos.some(isTarget)) return todos;
  return todos.filter(t => !isTarget(t));
}

/* =========================================================
   4. 파생 상태  — 보여줄 목록과 진행률
   ========================================================= */
function visibleTodos(todos, statusFilter, categoryFilter) {
  const pool = todos.filter(t => categoryFilter === "all" || t.category === categoryFilter);
  const active = pool.filter(t => !t.done).sort((a, b) => a.createdAt - b.createdAt);
  const done = pool.filter(t => t.done).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
  if (statusFilter === "active") return active;
  if (statusFilter === "done") return done;
  return active.concat(done);
}

function progress(todos, category = "all") {
  const pool = todos.filter(t => category === "all" || t.category === category);
  const total = pool.length;
  const done = pool.filter(t => t.done).length;
  return { done, total, percent: total === 0 ? 0 : Math.round((done / total) * 100) };
}

/* =========================================================
   5. RENDER  — 상태를 화면에 반영한다 (항상 전체를 다시 그린다)
   ========================================================= */
const FALLBACK_CATEGORY = { label: "기타", color: "#6b7280" };

function categoryOf(key) {
  return CATEGORIES[key] || FALLBACK_CATEGORY;
}

function renderList(listEl, todos, editingId) {
  listEl.textContent = "";
  const tpl = document.getElementById("todo-item");
  for (const todo of todos) {
    const li = tpl.content.firstElementChild.cloneNode(true);
    li.dataset.id = todo.id;
    if (todo.done) li.classList.add("done");
    li.querySelector(".check").checked = todo.done;

    const cat = categoryOf(todo.category);
    const badge = li.querySelector(".badge");
    badge.textContent = cat.label;
    badge.style.color = cat.color;
    badge.style.backgroundColor = cat.color + "1a";

    const textEl = li.querySelector(".text");
    if (editingId === todo.id) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "edit-input";
      input.maxLength = MAX_LEN;
      input.value = todo.text;
      textEl.replaceWith(input);
    } else {
      textEl.textContent = todo.text;
    }
    listEl.appendChild(li);
  }
}

function renderProgress(progressEl, todos) {
  progressEl.textContent = "";
  const all = progress(todos);

  const bar = document.createElement("div");
  bar.className = "bar";
  const fill = document.createElement("div");
  fill.className = "bar-fill";
  fill.style.width = all.percent + "%";
  bar.appendChild(fill);

  const summary = document.createElement("div");
  summary.className = "summary";
  summary.textContent = all.done + "/" + all.total + " (" + all.percent + "%)";

  const perCategory = document.createElement("div");
  perCategory.className = "per-category";
  perCategory.textContent = Object.keys(CATEGORIES).map(key => {
    const p = progress(todos, key);
    return CATEGORIES[key].label + " " + p.done + "/" + p.total;
  }).join(" · ");

  progressEl.appendChild(bar);
  progressEl.appendChild(summary);
  progressEl.appendChild(perCategory);
}

function render(root, state, ui) {
  const warningEl = root.querySelector("#warning");
  warningEl.textContent = ui.warning || "";
  warningEl.hidden = !ui.warning;

  renderProgress(root.querySelector("#progress"), state.todos);

  const shown = visibleTodos(state.todos, ui.statusFilter, ui.categoryFilter);
  renderList(root.querySelector("#list"), shown, ui.editingId);

  root.querySelectorAll("[data-status]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.status === ui.statusFilter);
  });

  const emptyEl = root.querySelector("#empty");
  if (shown.length > 0) {
    emptyEl.hidden = true;
  } else {
    emptyEl.hidden = false;
    emptyEl.textContent = state.todos.length === 0
      ? "할 일이 없습니다. 위에서 추가해 보세요."
      : "조건에 맞는 할 일이 없습니다.";
  }
}

/* =========================================================
   6. EVENTS  — 상태 보유와 리스너 연결
   흐름: 이벤트 → 상태 교체 → 저장 → 전체 재렌더
   ========================================================= */
let state = { version: 1, todos: [] };
let ui = { statusFilter: "active", categoryFilter: "all", editingId: null, warning: null };
let appRoot = null;   // mount 전(테스트 실행 중)에는 그리지 않는다

function rerender() {
  if (appRoot) render(appRoot, state, ui);
}

function setTodos(nextTodos) {
  state = { ...state, todos: nextTodos };
  const result = saveState(state);
  ui.warning = result.ok ? null : "저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.";
  rerender();
}

function setUi(patch) {
  ui = { ...ui, ...patch };
  rerender();
}

function fillCategorySelects(root) {
  const addSelect = root.querySelector("#category");
  const filterSelect = root.querySelector("#filter-category");
  addSelect.textContent = "";
  filterSelect.textContent = "";

  const allOption = document.createElement("option");
  allOption.value = "all";
  allOption.textContent = "전체";
  filterSelect.appendChild(allOption);

  for (const key of Object.keys(CATEGORIES)) {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = CATEGORIES[key].label;
    addSelect.appendChild(option);
    filterSelect.appendChild(option.cloneNode(true));
  }
}

function mount(root) {
  appRoot = root;
  fillCategorySelects(root);

  const loaded = loadState();
  state = loaded.state;
  if (loaded.error === "corrupt") {
    ui.warning = "저장된 데이터가 손상되어 새로 시작합니다.";
  } else if (loaded.error === "unavailable") {
    ui.warning = "이 브라우저에서는 저장되지 않습니다.";
  }

  const textInput = root.querySelector("#text");
  const categorySelect = root.querySelector("#category");

  root.querySelector("#add-form").addEventListener("submit", event => {
    event.preventDefault();
    const next = addTodo(state.todos, textInput.value, categorySelect.value);
    if (next !== state.todos) setTodos(next);
    // 연속 입력을 위해 비우되 포커스는 유지한다. 카테고리 선택은 건드리지 않는다.
    textInput.value = "";
    textInput.focus();
  });

  // 리스너는 ul 하나에만 붙인다 (이벤트 위임)
  root.querySelector("#list").addEventListener("click", event => {
    const li = event.target.closest("li[data-id]");
    if (!li) return;
    const id = li.dataset.id;

    if (event.target.classList.contains("check")) {
      setTodos(toggleTodo(state.todos, id));
      return;
    }
    if (event.target.dataset.action === "delete") {
      if (confirm("삭제할까요?")) setTodos(removeTodo(state.todos, id));
    }
  });

  root.querySelectorAll("[data-status]").forEach(button => {
    button.addEventListener("click", () => {
      setUi({ statusFilter: button.dataset.status, editingId: null });
    });
  });

  root.querySelector("#filter-category").addEventListener("change", event => {
    setUi({ categoryFilter: event.target.value, editingId: null });
  });

  rerender();
}

/* =========================================================
   TEST HARNESS  (?test 일 때만 동작)
   ========================================================= */
const _tests = [];
function test(name, fn) { _tests.push({ name, fn }); }

function assertEq(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg ? msg + " — " : "") + "기대 " + String(expected) + ", 실제 " + String(actual));
  }
}

function assertDeep(actual, expected, msg) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) {
    throw new Error((msg ? msg + " — " : "") + "기대 " + e + ", 실제 " + a);
  }
}

function runTests() {
  const panel = document.getElementById("test-panel");
  let passed = 0;
  let failed = 0;
  for (const t of _tests) {
    const line = document.createElement("div");
    try {
      t.fn();
      passed++;
      line.textContent = "PASS " + t.name;
    } catch (err) {
      failed++;
      line.textContent = "FAIL " + t.name + ": " + err.message;
    }
    panel.appendChild(line);
  }
  const summary = document.createElement("div");
  summary.textContent = "TESTS: " + passed + " passed, " + failed + " failed";
  panel.appendChild(summary);
}

/* =========================================================
   TESTS
   ========================================================= */
// 여러 구획에서 쓰는 공용 헬퍼
const T = (over = {}) => ({ id: "a", text: "x", category: "work", done: false, createdAt: 1, completedAt: null, ...over });

test("assertEq는 같은 값을 통과시킨다", () => {
  assertEq(1 + 1, 2);
});

/* ---- STORAGE ---- */
function fakeStore(initial) {
  const data = { ...initial };
  return {
    getItem: k => (k in data ? data[k] : null),
    setItem: (k, v) => { data[k] = String(v); },
    removeItem: k => { delete data[k]; },
    _data: data
  };
}

test("빈 저장소는 빈 목록을 돌려준다", () => {
  const r = loadState(fakeStore({}));
  assertDeep(r.state, { version: 1, todos: [] });
  assertEq(r.error, null);
});

test("저장한 상태를 그대로 다시 읽는다", () => {
  const s = fakeStore({});
  const state = { version: 1, todos: [{ id: "a", text: "x", category: "work", done: false, createdAt: 1, completedAt: null }] };
  assertEq(saveState(state, s).ok, true);
  assertDeep(loadState(s).state, state);
});

test("깨진 JSON은 빈 목록 + corrupt 백업", () => {
  const raw = "{{{깨짐";
  const s = fakeStore({ [STORAGE_KEY]: raw });
  const r = loadState(s);
  assertDeep(r.state.todos, []);
  assertEq(r.error, "corrupt");
  assertEq(s._data[CORRUPT_KEY], raw);
});

test("todos가 배열이 아니면 corrupt로 처리한다", () => {
  const raw = JSON.stringify({ version: 1, todos: "없음" });
  const s = fakeStore({ [STORAGE_KEY]: raw });
  const r = loadState(s);
  assertDeep(r.state.todos, []);
  assertEq(r.error, "corrupt");
  assertEq(s._data[CORRUPT_KEY], raw);
});

test("쓰기가 막히면 ok:false를 돌려준다", () => {
  const s = fakeStore({});
  s.setItem = () => { throw new Error("QuotaExceeded"); };
  assertEq(saveState({ version: 1, todos: [] }, s).ok, false);
});

test("저장소 자체가 없으면 unavailable", () => {
  const s = { getItem: () => { throw new Error("blocked"); }, setItem: () => {}, removeItem: () => {} };
  assertEq(loadState(s).error, "unavailable");
});

/* ---- LOGIC ---- */
test("addTodo는 기본값을 채워 항목을 추가한다", () => {
  const r = addTodo([], "장 보기", "personal", 1000, () => "id1");
  assertEq(r.length, 1);
  assertDeep(r[0], { id: "id1", text: "장 보기", category: "personal", done: false, createdAt: 1000, completedAt: null });
});

test("공백만 입력하면 원본을 그대로 돌려준다", () => {
  const todos = [];
  assertEq(addTodo(todos, "   ", "work"), todos);
});

test("개행과 연속 공백을 공백 하나로 정규화한다", () => {
  const r = addTodo([], "앞\n뒤   사이", "work", 1, () => "id1");
  assertEq(r[0].text, "앞 뒤 사이");
});

test("정규화 후 200자를 넘으면 거부한다", () => {
  const todos = [];
  assertEq(addTodo(todos, "가".repeat(201), "work"), todos);
  assertEq(addTodo([], "가".repeat(200), "work", 1, () => "id1").length, 1);
});

test("생성한 ID가 이미 있으면 다시 생성한다", () => {
  let n = 0;
  const idFn = () => (n++ === 0 ? "dup" : "uniq");
  const r = addTodo([T({ id: "dup" })], "새 항목", "work", 1, idFn);
  assertEq(r[1].id, "uniq");
});

test("toggleTodo는 done을 뒤집고 completedAt을 설정한다", () => {
  const r = toggleTodo([T()], "a", 500);
  assertEq(r[0].done, true);
  assertEq(r[0].completedAt, 500);
  const back = toggleTodo(r, "a", 900);
  assertEq(back[0].done, false);
  assertEq(back[0].completedAt, null);
});

test("editTodo는 텍스트를 바꾸고 빈 텍스트는 거부한다", () => {
  assertEq(editTodo([T()], "a", "  새 제목 ")[0].text, "새 제목");
  const todos = [T()];
  assertEq(editTodo(todos, "a", "   "), todos);
});

test("removeTodo는 해당 id만 지운다", () => {
  const r = removeTodo([T({ id: "a" }), T({ id: "b" })], "a");
  assertEq(r.length, 1);
  assertEq(r[0].id, "b");
});

test("clearCompleted는 완료 항목만, 카테고리 범위 안에서 지운다", () => {
  const todos = [
    T({ id: "1", done: true, category: "work" }),
    T({ id: "2", done: true, category: "study" }),
    T({ id: "3", done: false, category: "work" })
  ];
  assertDeep(clearCompleted(todos, "all").map(t => t.id), ["3"]);
  assertDeep(clearCompleted(todos, "work").map(t => t.id), ["2", "3"]);
});

test("없는 id를 건드리면 원본을 그대로 돌려준다", () => {
  const todos = [T()];
  assertEq(toggleTodo(todos, "없음"), todos);
  assertEq(removeTodo(todos, "없음"), todos);
});

/* ---- 파생 상태 ---- */
test("미완료는 추가순, 완료는 최근 완료순으로 정렬한다", () => {
  const todos = [
    T({ id: "b", createdAt: 20 }),
    T({ id: "a", createdAt: 10 }),
    T({ id: "c", done: true, completedAt: 100 }),
    T({ id: "d", done: true, completedAt: 200 })
  ];
  assertDeep(visibleTodos(todos, "active", "all").map(t => t.id), ["a", "b"]);
  assertDeep(visibleTodos(todos, "done", "all").map(t => t.id), ["d", "c"]);
  assertDeep(visibleTodos(todos, "all", "all").map(t => t.id), ["a", "b", "d", "c"]);
});

test("원본 배열을 변형하지 않는다", () => {
  const todos = [T({ id: "b", createdAt: 20 }), T({ id: "a", createdAt: 10 })];
  visibleTodos(todos, "all", "all");
  assertEq(todos[0].id, "b");
});

test("카테고리 필터는 상태 필터와 AND로 결합한다", () => {
  const todos = [T({ id: "a", category: "work" }), T({ id: "b", category: "study" })];
  assertDeep(visibleTodos(todos, "active", "work").map(t => t.id), ["a"]);
  assertDeep(visibleTodos(todos, "done", "work").map(t => t.id), []);
});

test("progress는 완료 비율을 정수 퍼센트로 돌려준다", () => {
  const todos = [T({ id: "a", done: true }), T({ id: "b" }), T({ id: "c" })];
  assertDeep(progress(todos), { done: 1, total: 3, percent: 33 });
});

test("할 일이 없으면 0/0 0%", () => {
  assertDeep(progress([]), { done: 0, total: 0, percent: 0 });
  assertDeep(progress([T({ category: "work" })], "study"), { done: 0, total: 0, percent: 0 });
});

test("카테고리별 진행률을 따로 센다", () => {
  const todos = [T({ id: "a", category: "work", done: true }), T({ id: "b", category: "work" }), T({ id: "c", category: "study" })];
  assertDeep(progress(todos, "work"), { done: 1, total: 2, percent: 50 });
});

/* ---- RENDER ---- */
const detachedList = () => document.createElement("ul");

test("renderList는 항목 수와 순서를 반영한다", () => {
  const ul = detachedList();
  renderList(ul, [T({ id: "a", text: "첫째" }), T({ id: "b", text: "둘째" })], null);
  assertEq(ul.children.length, 2);
  assertEq(ul.children[0].dataset.id, "a");
  assertEq(ul.querySelector("li .text").textContent, "첫째");
});

test("완료 항목에 done 클래스를 붙인다", () => {
  const ul = detachedList();
  renderList(ul, [T({ done: true })], null);
  assertEq(ul.children[0].classList.contains("done"), true);
});

test("재렌더는 이전 항목을 남기지 않는다", () => {
  const ul = detachedList();
  renderList(ul, [T({ id: "a" }), T({ id: "b" })], null);
  renderList(ul, [T({ id: "c" })], null);
  assertEq(ul.children.length, 1);
  assertEq(ul.children[0].dataset.id, "c");
});

test("텍스트를 HTML로 해석하지 않는다", () => {
  const ul = detachedList();
  const raw = "<img src=x onerror=alert(1)>";
  renderList(ul, [T({ text: raw })], null);
  assertEq(ul.querySelector(".text").textContent, raw);
  assertEq(ul.querySelector(".text img"), null);
});

test("카테고리 배지에 라벨을 쓴다", () => {
  const ul = detachedList();
  renderList(ul, [T({ category: "study" })], null);
  assertEq(ul.querySelector(".badge").textContent, "공부");
});

test("모르는 카테고리는 기타로 그린다", () => {
  assertDeep(categoryOf("없는값"), { label: "기타", color: "#6b7280" });
  const ul = detachedList();
  renderList(ul, [T({ category: "없는값" })], null);
  assertEq(ul.querySelector(".badge").textContent, "기타");
});

test("편집 중인 항목은 입력 필드로 그린다", () => {
  const ul = detachedList();
  renderList(ul, [T({ id: "a", text: "원래" })], "a");
  assertEq(ul.querySelector("li input.edit-input").value, "원래");
});

test("renderProgress는 개수와 퍼센트를 함께 쓴다", () => {
  const el = document.createElement("div");
  renderProgress(el, [T({ id: "a", done: true }), T({ id: "b" })]);
  assertEq(el.textContent.includes("1/2"), true);
  assertEq(el.textContent.includes("50%"), true);
  assertEq(el.textContent.includes("업무"), true);
});

/* ---- EVENTS ---- */
test("저장에 실패하면 경고를 세우고 목록은 유지한다", () => {
  const before = state.todos;
  const realSave = saveState;
  saveState = () => ({ ok: false, error: "QuotaExceeded" });
  setTodos([T({ id: "zz" })]);
  assertEq(ui.warning !== null, true);
  assertEq(state.todos.length, 1);
  // 복구는 state 를 직접 되돌린다. setTodos 로 되돌리면 실제 localStorage 를
  // 빈 목록으로 덮어써서 사용자 데이터가 날아간다.
  saveState = realSave;
  state = { ...state, todos: before };
  setUi({ warning: null });
});
